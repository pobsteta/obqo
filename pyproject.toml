[project]
name = "obqo"
version = "0.5.1"
description = "Calepinage, nomenclature et metre pour le systeme constructif obqo (bois massif cheville)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.optional-dependencies]
solveur = ["ortools>=9.11"]
dessins = ["reportlab>=4.2", "ezdxf>=1.3"]
volume = ["trimesh>=4.5"]
web = ["fastapi>=0.115", "uvicorn>=0.32", "jinja2>=3.1"]

[dependency-groups]
# « complet » reference les extras du projet : `uv sync` installe ainsi toute
# l'application, tandis que `pip install obqo` reste minimal et que
# `pip install obqo[dessins]` garde son sens.
complet = ["obqo[solveur,dessins,volume,web]"]
dev = [
    "httpx2",
    "types-pyyaml",
    "pytest>=8.3",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest-cov>=7.1.0",
]

[project.scripts]
obqo = "obqo.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obqo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

mypy_path = "src"
packages = ["obqo", "outils"]
# « outils » n'est pas livre dans la roue, mais il ecrit les versions du depot :
# une erreur y coute un tag faux, qui ne se reprend pas.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "lent: preuves d'optimalite du solveur de debit ; exclure avec -m 'not lent'",
]

# reportlab, ezdxf et trimesh ne publient pas de stubs : seuls les back-ends de
# dessin les touchent, le coeur reste type strictement.
[[tool.mypy.overrides]]
module = ["reportlab.*", "ezdxf.*", "trimesh.*"]
ignore_missing_imports = true

[tool.uv]
default-groups = ["dev", "complet"]
